<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foot Manager — Documents</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  body { background:#f4f6f8; color:#1a1a2e; }
  header { background:#1a1a2e; color:#fff; padding:14px 16px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:50; }
  .burger { background:none; border:none; color:#fff; font-size:22px; cursor:pointer; }
  header h1 { font-size:18px; font-weight:600; }
  nav { position:fixed; top:0; left:-280px; width:280px; height:100vh; background:#1a1a2e; color:#fff; padding:20px 16px; transition:left .25s; z-index:100; overflow-y:auto; }
  nav.open { left:0; }
  nav .close { background:none; border:none; color:#fff; font-size:20px; float:right; cursor:pointer; }
  nav a { display:block; color:#cbd5e1; text-decoration:none; padding:10px 8px; border-radius:6px; font-size:15px; }
  nav a:hover { background:#2d2d44; color:#fff; }
  nav .sub { padding-left:20px; font-size:13px; }
  .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:90; }
  .overlay.open { display:block; }
  main { max-width:900px; margin:0 auto; padding:16px; }
  .filter-bar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .filter-bar select, .filter-bar input { padding:8px 12px; border:1px solid #cbd5e1; border-radius:8px; font-size:13px; background:#fff; }
  .filter-bar input { flex:1; min-width:140px; }
  .btn { border:none; border-radius:8px; padding:10px 16px; font-size:14px; font-weight:600; cursor:pointer; }
  .btn.primary { background:#1a1a2e; color:#fff; }
  .btn.primary:hover { background:#2d2d44; }
  .btn.ghost { background:#e2e8f0; color:#1a1a2e; }
  .btn.danger { background:#fee2e2; color:#991b1b; }
  .card { background:#fff; border-radius:10px; padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .card h3 { font-size:15px; margin-bottom:4px; }
  .card .meta { font-size:13px; color:#64748b; }
  .badge { display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:10px; }
  .badge.certificat { background:#dbeafe; color:#1d4ed8; }
  .badge.justificatif { background:#e2e8f0; color:#475569; }
  .badge.licence { background:#dcfce7; color:#166534; }
  .badge.autorisation { background:#fef9c3; color:#854d0e; }
  .badge.autre { background:#f3e8ff; color:#7e22ce; }
  .badge.rdv-fait { background:#dcfce7; color:#166534; }
  .badge.rdv-attente { background:#fef9c3; color:#854d0e; }
  .badge.rdv-prevu { background:#dbeafe; color:#1d4ed8; }
  .doc-row { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid #f1f5f9; font-size:14px; }
  .doc-row:last-child { border:none; }
  .doc-row .thumb { width:48px; height:48px; border-radius:6px; background:#f1f5f9; display:flex; align-items:center; justify-content:center; font-size:20px; overflow:hidden; flex-shrink:0; }
  .doc-row .thumb img { width:100%; height:100%; object-fit:cover; }
  .doc-actions { display:flex; gap:4px; flex-shrink:0; }
  .doc-actions button { padding:4px 8px; font-size:12px; border-radius:6px; border:none; cursor:pointer; background:#e2e8f0; }
  .empty { text-align:center; color:#94a3b8; padding:40px 16px; font-size:14px; }
  .stats { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .stats .s { background:#fff; border-radius:8px; padding:10px 14px; font-size:13px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .stats .s b { font-size:18px; display:block; }
  @media (max-width:600px) { .doc-row { flex-wrap:wrap; } .doc-actions { width:100%; justify-content:flex-end; } }
</style>
</head>
<body>
<header>
  <button class="burger" onclick="toggleNav()">☰</button>
  <h1>Documents</h1>
</header>
<nav id="nav">
  <button class="close" onclick="toggleNav()">✕</button>
  <a href="index.html">Tableau de bord</a>
  <a href="categories.html">Catégories</a>
  <div class="sub">
    <a href="categorie.html?cat=U6">U6</a><a href="categorie.html?cat=U7">U7</a><a href="categorie.html?cat=U8">U8</a><a href="categorie.html?cat=U9">U9</a><a href="categorie.html?cat=U10">U10</a><a href="categorie.html?cat=U11">U11</a><a href="categorie.html?cat=U12">U12</a><a href="categorie.html?cat=U13">U13</a><a href="categorie.html?cat=U14">U14</a><a href="categorie.html?cat=U15">U15</a><a href="categorie.html?cat=U16">U16</a><a href="categorie.html?cat=U17">U17</a><a href="categorie.html?cat=U18">U18</a>
  </div>
  <a href="matchs.html">Matchs</a>
  <a href="presences.html">Présences</a>
  <a href="convocations.html">Convocations</a>
  <a href="documents.html" style="background:#2d2d44;color:#fff">Documents</a>
  <a href="parametres.html">Paramètres</a>
  <a href="export.html">Export</a>
</nav>
<div class="overlay" id="overlay" onclick="toggleNav()"></div>
<main>
  <div class="stats" id="stats"></div>
  <div class="filter-bar">
    <select id="filtreJoueur" onchange="render()"><option value="">Tous les joueurs</option></select>
    <select id="filtreType" onchange="render()">
      <option value="">Tous les types</option>
      <option value="certificat">Certificat médical</option>
      <option value="justificatif">Justificatif</option>
      <option value="licence">Licence</option>
      <option value="autorisation">Autorisation parentale</option>
      <option value="autre">Autre</option>
    </select>
    <input type="text" id="recherche" placeholder="Rechercher..." oninput="render()">
  </div>
  <button class="btn primary" style="width:100%;margin-bottom:12px" onclick="ouvrirAjout()">+ Ajouter un document</button>
  <div id="liste"></div>
</main>

<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:16px">
  <div style="background:#fff;border-radius:12px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto">
    <h2 style="font-size:17px;margin-bottom:16px">Ajouter un document</h2>
    <div class="form-row" style="margin-bottom:12px"><label style="display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:#475569">Joueur</label><select id="dJoueur" style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px"></select></div>
    <div class="form-row" style="margin-bottom:12px"><label style="display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:#475569">Type</label><select id="dType" style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px"><option value="certificat">Certificat médical</option><option value="justificatif">Justificatif</option><option value="licence">Licence</option><option value="autorisation">Autorisation parentale</option><option value="autre">Autre</option></select></div>
    <div class="form-row" style="margin-bottom:12px"><label style="display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:#475569">Fichier</label><input type="file" id="dFichier" accept="image/*,.pdf" style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px"></div>
    <div style="text-align:center;margin-bottom:12px;font-size:13px;color:#94a3b8">ou</div>
    <div class="form-row" style="margin-bottom:12px"><label style="display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:#475569">Prendre une photo</label><input type="file" id="dPhoto" accept="image/*" capture="environment" style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px"></div>
    <div class="form-row" style="margin-bottom:16px"><label style="display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:#475569">Rendez-vous médical</label><select id="dRdv" style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px"><option value="fait">Effectué</option><option value="attente">En attente</option><option value="prevu">À prévoir</option></select></div>
    <div style="display:flex;gap:8px">
      <button class="btn ghost" style="flex:1" onclick="fermerModal()">Annuler</button>
      <button class="btn primary" style="flex:1" onclick="sauverDoc()">Enregistrer</button>
    </div>
  </div>
</div>

<script>
let db = JSON.parse(localStorage.getItem('footmanager') || '{"joueurs":[],"documents":[]});
if (!db.joueurs) db.joueurs = [];
if (!db.documents) db.documents = [];

function save() { localStorage.setItem('footmanager', JSON.stringify(db)); }

function toggleNav() {
  document.getElementById('nav').classList.toggle('open);
  document.getElementById('overlay').classList.toggle('open);
}

const TYPES = { certificat:'Certificat médical', justificatif:'Justificatif', licence:'Licence', autorisation:'Autorisation parentale', autre:'Autre' };
const RDV = { fait:'Effectué', attente:'En attente', prevu:'À prévoir' };

db.joueurs.forEach(j => {
  document.getElementById('filtreJoueur').innerHTML += `<option value="${j.id}">${j.prenom} ${j.nom} (${j.cat})</option>`;
  document.getElementById('dJoueur').innerHTML += `<option value="${j.id}">${j.prenom} ${j.nom} (${j.cat})</option>`;
});

function render() {
  const fj = document.getElementById('filtreJoueur').value;
  const ft = document.getElementById('filtreType').value;
  const q = document.getElementById('recherche').value.toLowerCase();
  let list = db.documents.slice().reverse();
  if (fj) list = list.filter(d => d.joueurId === fj);
  if (ft) list = list.filter(d => d.type === ft);
  if (q) list = list.filter(d => {
    const j = db.joueurs.find(x => x.id === d.joueurId);
    return j && (j.prenom + ' ' + j.nom).toLowerCase().includes(q);
  });
  const el = document.getElementById('liste);
  if (!list.length) { el.innerHTML = '<div class="empty">Aucun document.</div>'; }
  else {
    el.innerHTML = list.map(d => {
      const j = db.joueurs.find(x => x.id === d.joueurId);
      const nom = j ? j.prenom + ' ' + j.nom : '?';
      const cat = j ? j.cat : '';
      const thumb = d.data ? `<img src="${d.data}">` : '📄';
      return `<div class="card"><div class="doc-row">
        <div class="thumb">${thumb}</div>
        <div style="flex:1"><h3>${nom} <span class="badge ${d.type}">${TYPES[d.type]}</span></h3>
        <div class="meta">${cat} · Ajouté le ${d.dateAjout}${d.rdv ? ' · RDV médical : <span class="badge rdv-' + d.rdv + '">' + RDV[d.rdv] + '</span>' : ''}</div></div>
        <div class="doc-actions">
          ${d.data ? `<button onclick="voirDoc('${d.id}')">Voir</button><button onclick="dlDoc('${d.id}')">DL</button>` : ''}
          <button onclick="remplacerDoc('${d.id}')">Remplacer</button>
          <button class="danger" onclick="supprimerDoc('${d.id}')">Suppr.</button>
        </div>
      </div></div>`;
    }).join('');
  }
  const total = db.documents.length;
  const parType = {};
  db.documents.forEach(d => { parType[d.type] = (parType[d.type]||0)+1; });
  const rdvAttente = db.documents.filter(d => d.rdv === 'attente' || d.rdv === 'prevu').length;
  document.getElementById('stats').innerHTML = `<div class="s"><b>${total}</b> documents</div>` +
    Object.entries(parType).map(([t,n]) => `<div class="s"><b>${n}</b> ${TYPES[t]}</div>`).join('') +
    (rdvAttente ? `<div class="s" style="background:#fef9c3"><b>${rdvAttente}</b> RDV à traiter</div>` : '');
}

function ouvrirAjout() {
  document.getElementById('dFichier').value = '';
  document.getElementById('dPhoto').value = '';
  document.getElementById('dRdv').value = 'fait';
  document.getElementById('modal').style.display = 'flex';
}
function fermerModal() { document.getElementById('modal').style.display = 'none'; }

function lireFichier(input, cb) {
  const f = input.files[0];
  if (!f) { cb(null); return; }
  const r = new FileReader();
  r.onload = () => cb(r.result);
  r.readAsDataURL(f);
}

function sauverDoc() {
  const joueurId = document.getElementById('dJoueur').value;
  if (!joueurId) { alert('Choisis un joueur.'); return; }
  const type = document.getElementById('dType').value;
  const rdv = document.getElementById('dRdv').value;
  const fin = (data) => {
    db.documents.push({ id:'d'+Date.now(), joueurId, type, rdv, data: data||null, dateAjout: new Date().toLocaleDateString('fr-FR') });
    if (type === 'certificat') {
      const j = db.joueurs.find(x => x.id === joueurId);
      if (j) j.rdvMedical = rdv;
    }
    save(); fermerModal(); render();
  };
  const pf = document.getElementById('dPhoto').files[0];
  const ff = document.getElementById('dFichier').files[0];
  if (pf) lireFichier(document.getElementById('dPhoto'), fin);
  else if (ff) lireFichier(document.getElementById('dFichier'), fin);
  else fin(null);
}

function voirDoc(id) {
  const d = db.documents.find(x => x.id === id);
  if (d && d.data) window.open(d.data, '_blank);
}
function dlDoc(id) {
  const d = db.documents.find(x => x.id === id);
  if (!d || !d.data) return;
  const a = document.createElement('a'); a.href = d.data; a.download = (TYPES[d.type]||'document') + '-' + id + '.jpg'; a.click();
}
function remplacerDoc(id) {
  const d = db.documents.find(x => x.id === id);
  if (!d) return;
  const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*,.pdf';
  input.onclick = function(){ this.value = null; };
  input.onchange = function(){
    lireFichier(this, data => { if (data) { d.data = data; d.dateAjout = new Date().toLocaleDateString('fr-FR'); save(); render(); } });
  };
  input.click();
}
function supprimerDoc(id) {
  if (!confirm('Supprimer ce document ? L\'original est effacé.')) return;
  db.documents = db.documents.filter(x => x.id !== id);
  save(); render();
}

render();
</script>
</body>
</html>
