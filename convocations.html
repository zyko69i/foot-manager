<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convocations — Foot Manager</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
  body { background:#f4f6f8; color:#1a1a2e; }
  header { background:#1a1a2e; color:#fff; padding:14px 20px; display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:10; }
  .burger { font-size:26px; cursor:pointer; background:none; border:none; color:#fff; }
  header h1 { font-size:20px; font-weight:600; }
  .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:20; }
  .overlay.open { display:block; }
  nav { position:fixed; top:0; left:-280px; width:280px; height:100%; background:#1a1a2e; color:#fff; z-index:30; transition:left .25s; padding:20px 0; overflow-y:auto; }
  nav.open { left:0; }
  nav .close { font-size:24px; background:none; border:none; color:#fff; cursor:pointer; padding:0 20px 16px; display:block; }
  nav a { display:block; padding:12px 20px; color:#d0d0e0; text-decoration:none; font-size:15px; }
  nav a:hover, nav a.active { background:#2a2a45; color:#fff; }
  nav .sub { padding-left:36px; font-size:13px; color:#9a9ab0; }
  main { max-width:1100px; margin:0 auto; padding:20px; }
  h2 { font-size:22px; margin-bottom:16px; }
  .filters { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:20px; align-items:center; }
  select, input { padding:10px 14px; border:1px solid #ccc; border-radius:8px; font-size:14px; background:#fff; }
  .btn { padding:10px 18px; border:none; border-radius:8px; font-size:14px; cursor:pointer; font-weight:600; }
  .btn-primary { background:#2e7d32; color:#fff; }
  .btn-primary:hover { background:#256628; }
  .btn-secondary { background:#e0e0e0; color:#333; }
  .card { background:#fff; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.08); overflow:hidden; margin-bottom:24px; }
  .card-head { background:#1a1a2e; color:#fff; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
  .card-head h3 { font-size:16px; }
  .card-head .meta { font-size:13px; color:#b0b0c8; }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:12px 16px; text-align:left; border-bottom:1px solid #eee; font-size:14px; }
  th { background:#f8f8fc; font-weight:600; color:#555; }
  tr:hover td { background:#fafafa; }
  .check { width:44px; text-align:center; }
  .check input { width:22px; height:22px; cursor:pointer; }
  .tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; font-weight:600; }
  .tag-home { background:#e3f2fd; color:#1565c0; }
  .tag-away { background:#fff3e0; color:#e65100; }
  .stats-row { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
  .stat-card { background:#fff; border-radius:10px; padding:16px 20px; box-shadow:0 2px 8px rgba(0,0,0,.08); flex:1; min-width:140px; }
  .stat-card .num { font-size:26px; font-weight:700; }
  .stat-card .label { font-size:12px; color:#777; text-transform:uppercase; letter-spacing:.5px; }
  .empty { text-align:center; padding:40px; color:#999; }
  .suivi { margin-top:24px; }
  .suivi h3 { font-size:18px; margin-bottom:12px; }
  .bar { height:10px; background:#eee; border-radius:5px; overflow:hidden; margin-top:4px; }
  .bar > div { height:100%; background:#2e7d32; border-radius:5px; }
  @media (max-width:600px) { table { font-size:13px; } th, td { padding:10px 8px; } }
</style>
</head>
<body>
<header>
  <button class="burger" onclick="toggleNav()">☰</button>
  <h1>Convocations</h1>
</header>
<div class="overlay" id="overlay" onclick="toggleNav()"></div>
<nav id="nav">
  <button class="close" onclick="toggleNav()">✕</button>
  <a href="index.html">Tableau de bord</a>
  <a href="categories.html">Catégories</a>
  <div class="sub">U6 à U18</div>
  <a href="matchs.html">Matchs</a>
  <a href="presences.html">Présences</a>
  <a href="convocations.html" class="active">Convocations</a>
  <a href="#" onclick="alert('Page à construire')">Documents</a>
  <a href="#" onclick="alert('Page à construire')">Paramètres</a>
  <a href="export.html">Export</a>
</nav>
<main>
  <h2>Convocations par match</h2>
  <div class="filters">
    <select id="catFilter" onchange="render()">
      <option value="">Toutes les catégories</option>
    </select>
    <select id="saisonFilter" onchange="render()">
      <option value="2026-2027">Saison 2026-2027</option>
      <option value="2025-2026">Saison 2025-2026</option>
    </select>
    <button class="btn btn-primary" onclick="newConvoc()">+ Nouvelle convocation</button>
  </div>
  <div class="stats-row" id="stats"></div>
  <div id="convocs"></div>
  <div class="suivi">
    <h3>Suivi annuel par joueur</h3>
    <div id="suivi"></div>
  </div>
</main>
<script>
const CATS = ['U6','U7','U8','U9','U10','U11','U12','U13','U14','U15','U16','U17','U18'];

function load(k, fb){ try{ return JSON.parse(localStorage.getItem(k)) ?? fb; }catch(e){ return fb; } }
function save(k, v){ localStorage.setItem(k, JSON.stringify(v)); }

let players = load('fm_players', []);
let convocs = load('fm_convocs', []);
let matchs = load('fm_matchs', []).length ? load('fm_matchs', []) : null;

if(!players.length){
  const demo = [];
  CATS.forEach((c,i)=>{
    for(let j=0;j<Math.floor(Math.random()*6)+4;j++){
      demo.push({id:'p'+i+j, nom:'Dupont', prenom:'J'+j, categorie:c, statut:'actif', maillot:j+1});
    }
  });
  players = demo; save('fm_players', players);
}
if(!convocs.length){
  const c = [];
  CATS.forEach(cat=>{
    for(let m=0;m<3;m++){
      c.push({id:'cv'+cat+m, categorie:cat, saison:'2026-2027', match:'Match '+ (m+1) +' vs Équipe B', date:'2026-11-'+(10+m*7), domicile:m%2===0, joueurs:players.filter(p=>p.categorie===cat).map(p=>({id:p.id, convoque:Math.random()>.25, joue:Math.random()>.35, tempsJeu:Math.floor(Math.random()*90)}))});
    }
  });
  convocs = c; save('fm_convocs', convocs);
}

const cf = document.getElementById('catFilter'), sf = document.getElementById('saisonFilter'), cv = document.getElementById('convocs'), st = document.getElementById('stats'), su = document.getElementById('suivi');
CATS.forEach(c=>cf.add(new Option(c,c)));

function toggleNav(){ document.getElementById('nav').classList.toggle('open'); document.getElementById('overlay').classList.toggle('open'); }

function newConvoc(){
  const cat = cf.value || prompt('Catégorie :', 'U11'); if(!cat) return;
  const match = prompt('Match (adversaire) :', '') ; if(!match) return;
  const date = prompt('Date (AAAA-MM-JJ) :', new Date().toISOString().slice(0,10)); if(!date) return;
  const domicile = confirm('Domicile ? (OK = oui, Annuler = extérieur)');
  const joueurs = players.filter(p=>p.categorie===cat).map(p=>({id:p.id, convoque:true, joue:false, tempsJeu:0}));
  convocs.unshift({id:'cv'+Date.now(), categorie:cat, saison:sf.value, match:'vs '+match, date, domicile, joueurs});
  save('fm_convocs', convocs); render();
}

function toggle(cid, pid, field){
  const c = convocs.find(x=>x.id===cid); if(!c) return;
  const j = c.joueurs.find(x=>x.id===pid); if(!j) return;
  j[field] = !j[field];
  if(field==='joue' && !j[field]) j.tempsJeu = 0;
  if(field==='convoque' && !j[field]){ j.joue=false; j.tempsJeu=0; }
  save('fm_convocs', convocs); render();
}

function setTemps(cid, pid, v){
  const c = convocs.find(x=>x.id===cid); if(!c) return;
  const j = c.joueurs.find(x=>x.id===pid); if(!j) return;
  j.tempsJeu = Math.max(0, Math.min(120, parseInt(v)||0));
  save('fm_convocs', convocs); render();
}

function delConvoc(cid){ if(!confirm('Supprimer cette convocation ?')) return; convocs = convocs.filter(c=>c.id!==cid); save('fm_convocs', convocs); render(); }

function render(){
  const cat = cf.value, saison = sf.value;
  let list = convocs.slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(cat) list = list.filter(c=>c.categorie===cat);
  if(saison) list = list.filter(c=>c.saison===saison);

  let totC=0, totJ=0, totT=0;
  convocs.forEach(c=>c.joueurs.forEach(j=>{ if(j.convoque)totC++; if(j.joue){totJ++; totT+=j.tempsJeu||0;} }));
  st.innerHTML = `
    <div class="stat-card"><div class="num">${totC}</div><div class="label">Convocations</div></div>
    <div class="stat-card green"><div class="num">${totJ}</div><div class="label">Matchs joués</div></div>
    <div class="stat-card"><div class="num">${Math.round(totT/60)}h</div><div class="label">Temps de jeu total</div></div>`;

  if(!list.length){ cv.innerHTML = '<div class="empty">Aucune convocation pour ces critères.</div>'; }
  else {
    cv.innerHTML = '';
    list.forEach(c=>{
      const box = document.createElement('div'); box.className='card';
      const head = document.createElement('div'); head.className='card-head';
      head.innerHTML = `<div><h3>${c.match}</h3><div class="meta">${c.categorie} — ${c.date} <span class="tag ${c.domicile?'tag-home':'tag-away'}">${c.domicile?'Domicile':'Extérieur'}</span></div></div><button class="btn btn-secondary" onclick="delConvoc('${c.id}')">Supprimer</button>`;
      box.appendChild(head);
      const tbl = document.createElement('table'); tbl.innerHTML = '<tr><th class="check">Convoqué</th><th class="check">A joué</th><th>Joueur</th><th>Temps de jeu (min)</th></tr>';
      c.joueurs.forEach(j=>{
        const p = players.find(x=>x.id===j.id); if(!p) return;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="check"><input type="checkbox" ${j.convoque?'checked':''} onclick="toggle('${c.id}','${j.id}','convoque')"></td>
          <td class="check"><input type="checkbox" ${j.joue?'checked':''} ${j.convoque?'':'disabled'} onclick="toggle('${c.id}','${j.id}','joue')"></td>
          <td><a href="joueur.html?id=${j.id}">${p.prenom} ${p.nom}</a></td>
          <td><input type="number" min="0" max="120" value="${j.tempsJeu||0}" style="width:70px;padding:6px;border:1px solid #ccc;border-radius:6px" onchange="setTemps('${c.id}','${j.id}',this.value)" ${j.joue?'':'disabled'}></td>`;
        tbl.appendChild(tr);
      });
      box.appendChild(tbl);
      cv.appendChild(box);
    });
  }

  // Suivi annuel
  const byPlayer = {};
  convocs.filter(c=>c.saison===saison).forEach(c=>{
    if(cat && c.categorie!==cat) return;
    c.joueurs.forEach(j=>{
      if(!byPlayer[j.id]) byPlayer[j.id] = {convoque:0, joue:0, temps:0, cat:c.categorie};
      if(j.convoque) byPlayer[j.id].convoque++;
      if(j.joue){ byPlayer[j.id].joue++; byPlayer[j.id].temps += j.tempsJeu||0; }
    });
  });
  const rows = Object.entries(byPlayer).map(([id,s])=>{ const p=players.find(x=>x.id===id); return {p, ...s}; }).filter(r=>r.p).sort((a,b)=>b.joue-a.joue);
  if(!rows.length){ su.innerHTML = '<div class="empty">Pas de données de suivi.</div>'; return; }
  const maxJoue = Math.max(...rows.map(r=>r.joue),1);
  su.innerHTML = '<table><tr><th>Joueur</th><th>Catégorie</th><th>Convocations</th><th>Matchs joués</th><th>Temps de jeu</th><th>Répartition</th></tr>' +
    rows.map(r=>`<tr><td><a href="joueur.html?id=${r.p.id}">${r.p.prenom} ${r.p.nom}</a></td><td>${r.cat}</td><td>${r.convoque}</td><td>${r.joue}</td><td>${Math.round(r.temps/60)}h${r.temps%60}min</td><td><div class="bar"><div style="width:${Math.round(r.joue/maxJoue*100)}%"></div></div></td></tr>`).join('') + '</table>';
}
render();
</script>
</body>
</html>
