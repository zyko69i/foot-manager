<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIMOUNI Soccer Stats — Fiche joueur</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
  body { background:#fafafa; color:#222; }
  header { background:#fff; color:#2FAEE0; height:72px; display:flex; align-items:center; padding:0 32px; border-bottom:1px solid #eee; }
  .logo { font-weight:700; font-size:22px; }
  .floating-burger { position:fixed; top:20px; left:20px; width:48px; height:48px; background:#fff; border:1px solid #e0e0e0; border-radius:50%; box-shadow:0 2px 10px rgba(0,0,0,.06); display:none; align-items:center; justify-content:center; font-size:24px; color:#2FAEE0; cursor:pointer; z-index:100; }
  .floating-burger.show { display:flex; }
  #overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.25); z-index:200; }
  #overlay.open { display:block; }
  nav { position:fixed; top:0; left:-280px; width:270px; height:100%; background:#fff; z-index:300; transition:left .25s; overflow-y:auto; padding:32px 0; box-shadow:2px 0 16px rgba(0,0,0,.08); }
  nav.open { left:0; }
  nav a { display:block; color:#333; text-decoration:none; padding:16px 28px; font-size:16px; }
  nav a:hover, nav a.active { background:#f7fbff; color:#2FAEE0; }
  main { max-width:880px; margin:0 auto; padding:48px 28px 120px; }
  h1 { font-size:28px; margin-bottom:8px; color:#2FAEE0; }
  .sub { font-size:15px; color:#777; margin-bottom:32px; }
  .bloc { background:#fff; border-radius:20px; padding:24px; box-shadow:0 4px 12px rgba(0,0,0,.03); margin-bottom:24px; border:1px solid #f0f0f0; }
  .bloc h2 { font-size:16px; text-transform:uppercase; letter-spacing:1px; color:#2FAEE0; margin-bottom:16px; }
  label { display:block; font-size:13px; color:#666; margin:12px 0 6px; font-weight:600; }
  input, select, textarea { width:100%; padding:12px 14px; border:1px solid #ddd; border-radius:12px; font-size:15px; background:#fff; }
  textarea { min-height:80px; resize:vertical; }
  .row { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; }
  .btns { display:flex; gap:12px; margin-top:32px; }
  .btn { border:none; border-radius:12px; padding:14px 24px; font-size:15px; font-weight:600; cursor:pointer; }
  .btn.primary { background:#2FAEE0; color:#fff; }
  .btn.ghost { background:#f0f0f0; color:#333; }
  .back-btn { position:fixed; bottom:24px; left:20px; width:44px; height:44px; background:#fff; border:1px solid #e0e0e0; border-radius:50%; box-shadow:0 2px 10px rgba(0,0,0,.06); display:flex; align-items:center; justify-content:center; font-size:20px; color:#2FAEE0; cursor:pointer; z-index:100; }
</style>
</head>
<body>
<header>
  <div class="logo">Fiche joueur</div>
</header>
<button class="floating-burger" id="floatBurger" onclick="toggleMenu()">&#9776;</button>
<div id="overlay" onclick="toggleMenu()"></div>
<nav id="menu">
  <a href="index.html">Tableau de bord</a>
  <a href="categories.html">Catégories</a>
  <a href="matchs.html">Matchs</a>
  <a href="presences.html">Présences</a>
  <a href="convocations.html">Convocations</a>
  <a href="documents.html">Documents</a>
  <a href="parametres.html">Paramètres</a>
  <a href="export.html">Export</a>
</nav>
<main>
  <h1 id="page-title">Nouvelle fiche</h1>
  <div class="sub" id="page-sub"></div>
  <div class="bloc">
    <h2>Identité</h2>
    <div class="row">
      <div><label>Nom</label><input id="f-nom"></div>
      <div><label>Prénom</label><input id="f-prenom"></div>
      <div><label>Date de naissance</label><input type="date" id="f-dnaiss"></div>
      <div><label>Catégorie</label><select id="f-cat"></select></div>
    </div>
  </div>
  <div class="bloc">
    <h2>Sportif</h2>
    <div class="row">
      <div><label>Numéro de maillot</label><input type="number" id="f-maillot"></div>
      <div><label>Poste</label><input id="f-poste"></div>
    </div>
  </div>
  <div class="btns">
    <button class="btn primary" onclick="sauvegarder()">Enregistrer</button>
    <button class="btn ghost" onclick="history.back()">Annuler</button>
  </div>
</main>
<button class="back-btn" onclick="history.back()">←</button>
<script>
const CATS = ['U6','U7','U8','U9','U10','U11','U12','U13','U14','U15','U16','U17','U18'];
function load(k,fb){ try{ return JSON.parse(localStorage.getItem(k)) ?? fb; }catch(e){ return fb; } }
function save(k,v){ localStorage.setItem(k, JSON.stringify(v)); }
let players = load('fm.players', []);
const params = new URLSearchParams(location.search);
const pid = params.get('id');
const isNew = params.get('new') === '1';
let player = pid ? players.find(p => String(p.id) === String(pid)) : null;
if (!player && isNew) {
  player = { id: Date.now(), cat: params.get('cat') || 'U11', statut: 'actif', prenom: '', nom: '', maillot: '', poste: '' };
}
const sel = document.getElementById('f-cat');
CATS.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o); });
function toggleMenu(){
  document.getElementById('menu').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}
function remplir(){
  if (!player) return;
  document.getElementById('page-title').textContent = (player.prenom || '') + ' ' + (player.nom || '') || 'Nouvelle fiche';
  document.getElementById('page-sub').textContent = 'Catégorie ' + (player.cat || '');
  document.getElementById('f-nom').value = player.nom || '';
  document.getElementById('f-prenom').value = player.prenom || '';
  document.getElementById('f-dnaiss').value = player.dnaiss || '';
  document.getElementById('f-cat').value = player.cat || 'U11';
  document.getElementById('f-maillot').value = player.maillot || '';
  document.getElementById('f-poste').value = player.poste || '';
}
function sauvegarder(){
  if (!player) return;
  player.nom = document.getElementById('f-nom').value;
  player.prenom = document.getElementById('f-prenom').value;
  player.dnaiss = document.getElementById('f-dnaiss').value;
  player.cat = document.getElementById('f-cat').value;
  player.maillot = document.getElementById('f-maillot').value;
  player.poste = document.getElementById('f-poste').value;
  const idx = players.findIndex(p => String(p.id) === String(player.id));
  if (idx >= 0) players[idx] = player; else players.push(player);
  save('fm.players', players);
  location.href = 'categorie.html?cat=' + player.cat;
}
window.addEventListener('scroll',()=>{
  const burger = document.getElementById('floatBurger');
  if (window.scrollY > 100) burger.classList.add('show');
  else burger.classList.remove('show');
});
remplir();
</script>
</body>
</html>
