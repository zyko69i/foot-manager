<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foot Manager — Paramètres</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  body { background:#f4f6f8; color:#1a1a2e; }
  header { background:#1a1a2e; color:#fff; padding:14px 16px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:50; }
  .burger { background:none; border:none; color:#fff; font-size:22px; cursor:pointer; }
  header h1 { font-size:18px; font-weight:600; }
  nav { position:fixed; top:0; left:-280px; width:280px; height:100vh; background:#1a1a2e; color:#fff; padding:20px 16px; transition:left .25s; z-index:100; overflow-y:auto; }
  nav.open { left:0; }
  nav .close { background:none; border:none; color:#fff; font-size:20px; float:right; cursor:pointer; }
  nav a { display:block; color:#cbd5e1; text-decoration:none; padding:10px 8px; border-radius:6px; font-size:15px; }
  nav a:hover { background:#2d2d44; color:#fff; }
  nav .sub { padding-left:20px; font-size:13px; }
  .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:90; }
  .overlay.open { display:block; }
  main { max-width:900px; margin:0 auto; padding:16px; }
  .section { background:#fff; border-radius:10px; padding:16px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .section h2 { font-size:16px; margin-bottom:12px; }
  .form-row { margin-bottom:12px; }
  .form-row label { display:block; font-size:13px; font-weight:600; margin-bottom:4px; color:#475569; }
  .form-row input, .form-row select, .form-row textarea { width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px; font-size:14px; }
  .btn { border:none; border-radius:8px; padding:10px 16px; font-size:14px; font-weight:600; cursor:pointer; }
  .btn.primary { background:#1a1a2e; color:#fff; }
  .btn.primary:hover { background:#2d2d44; }
  .btn.ghost { background:#e2e8f0; color:#1a1a2e; }
  .btn.danger { background:#fee2e2; color:#991b1b; }
  .coach-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .coach-row input, .coach-row select { flex:1; }
  .coach-row button { padding:6px 10px; border:none; border-radius:6px; background:#fee2e2; color:#991b1b; cursor:pointer; font-size:12px; }
  .logo-preview { width:80px; height:80px; border-radius:8px; background:#f1f5f9; display:flex; align-items:center; justify-content:center; font-size:28px; overflow:hidden; margin-bottom:8px; }
  .logo-preview img { width:100%; height:100%; object-fit:cover; }
  .danger-zone { border:2px solid #fecaca; }
  .danger-zone h2 { color:#991b1b; }
  .stats-mini { font-size:13px; color:#64748b; margin-bottom:12px; }
</style>
</head>
<body>
<header>
  <button class="burger" onclick="toggleNav()">☰</button>
  <h1>Paramètres</h1>
</header>
<nav id="nav">
  <button class="close" onclick="toggleNav()">✕</button>
  <a href="index.html">Tableau de bord</a>
  <a href="categories.html">Catégories</a>
  <div class="sub">
    <a href="categorie.html?cat=U6">U6</a><a href="categorie.html?cat=U7">U7</a><a href="categorie.html?cat=U8">U8</a><a href="categorie.html?cat=U9">U9</a><a href="categorie.html?cat=U10">U10</a><a href="categorie.html?cat=U11">U11</a><a href="categorie.html?cat=U12">U12</a><a href="categorie.html?cat=U13">U13</a><a href="categorie.html?cat=U14">U14</a><a href="categorie.html?cat=U15">U15</a><a href="categorie.html?cat=U16">U16</a><a href="categorie.html?cat=U17">U17</a><a href="categorie.html?cat=U18">U18</a>
  </div>
  <a href="matchs.html">Matchs</a>
  <a href="presences.html">Présences</a>
  <a href="convocations.html">Convocations</a>
  <a href="documents.html">Documents</a>
  <a href="parametres.html" style="background:#2d2d44;color:#fff">Paramètres</a>
  <a href="export.html">Export</a>
</nav>
<div class="overlay" id="overlay" onclick="toggleNav()"></div>
<main>
  <div class="section">
    <h2>Club</h2>
    <div class="form-row"><label>Nom du club</label><input type="text" id="clubNom" placeholder="Nom de votre club"></div>
    <div class="form-row"><label>Logo</label><div class="logo-preview" id="logoPreview">⚽</div><input type="file" id="clubLogo" accept="image/*"></div>
  </div>

  <div class="section">
    <h2>Éducateurs</h2>
    <div id="coachsList"></div>
    <button class="btn ghost" style="margin-top:8px" onclick="ajouterCoach()">+ Ajouter un éducateur</button>
  </div>

  <div class="section">
    <h2>Contact club</h2>
    <div class="form-row"><label>Téléphone</label><input type="tel" id="clubTel" placeholder="06 XX XX XX XX"></div>
    <div class="form-row"><label>E-mail</label><input type="email" id="clubEmail" placeholder="contact@club.fr"></div>
    <div class="form-row"><label>Adresse</label><textarea id="clubAdresse" rows="2" placeholder="Adresse du club"></textarea></div>
  </div>

  <div class="section">
    <h2>Données</h2>
    <div class="stats-mini" id="dataStats"></div>
    <button class="btn primary" onclick="exporterBackup()">📦 Exporter une sauvegarde (JSON)</button>
    <button class="btn ghost" style="margin-top:8px" onclick="importerBackup()">📥 Importer une sauvegarde</button>
  </div>

  <div class="section danger-zone">
    <h2>Zone dangereuse</h2>
    <p style="font-size:13px;color:#64748b;margin-bottom:12px">Supprime toutes les données : joueurs, matchs, présences, documents. Irréversible.</p>
    <button class="btn danger" onclick="viderTout()">Vider toutes les données</button>
  </div>

  <button class="btn primary" style="width:100%;margin-top:8px" onclick="sauver()">Enregistrer les paramètres</button>
</main>

<script>
let db = JSON.parse(localStorage.getItem('footmanager') || '{"joueurs":[],"matchs":[],"presences":{},"documents":[],"parametres":{}});
if (!db.joueurs) db.joueurs = [];
if (!db.matchs) db.matchs = [];
if (!db.presences) db.presences = {};
if (!db.documents) db.documents = [];
if (!db.parametres) db.parametres = {};

function save() { localStorage.setItem('footmanager', JSON.stringify(db)); }

function toggleNav() {
  document.getElementById('nav').classList.toggle('open);
  document.getElementById('overlay').classList.toggle('open);
}

const CAT = ['U6','U7','U8','U9','U10','U11','U12','U13','U14','U15','U16','U17','U18'];

// Charger les paramètres existants
document.getElementById('clubNom').value = db.parametres.clubNom || '';
document.getElementById('clubTel').value = db.parametres.clubTel || '';
document.getElementById('clubEmail').value = db.parametres.clubEmail || '';
document.getElementById('clubAdresse').value = db.parametres.clubAdresse || '';
if (db.parametres.logo) document.getElementById('logoPreview').innerHTML = `<img src="${db.parametres.logo}">`;

// Logo
document.getElementById('clubLogo').addEventListener('change', function() {
  const f = this.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onclick = function(){ this.value = null; };
  r.onload = () => {
    db.parametres.logo = r.result;
    document.getElementById('logoPreview').innerHTML = `<img src="${r.result}">`;
    save();
  };
  r.readAsDataURL(f);
});

// Coachs
function renderCoachs() {
  const list = db.parametres.coachs || [];
  const el = document.getElementById('coachsList);
  if (!list.length) { el.innerHTML = '<div style="font-size:13px;color:#94a3b8;margin-bottom:8px">Aucun éducateur.</div>'; return; }
  el.innerHTML = list.map((c, i) => `
    <div class="coach-row">
      <input type="text" value="${c.nom||''}" placeholder="Nom" onchange="updateCoach(${i},'nom',this.value)">
      <select onchange="updateCoach(${i},'cat',this.value)">
        <option value="">Catégorie</option>
        ${CAT.map(cat => `<option value="${cat}" ${c.cat===cat?'selected':''}>${cat}</option>`).join('')}
      </select>
      <input type="tel" value="${c.tel||''}" placeholder="Tél" onchange="updateCoach(${i},'tel',this.value)">
      <button onclick="supprimerCoach(${i})">✕</button>
    </div>`).join('');
}
function ajouterCoach() {
  if (!db.parametres.coachs) db.parametres.coachs = [];
  db.parametres.coachs.push({ nom:'', cat:'', tel:'' });
  save(); renderCoachs();
}
function updateCoach(i, k, v) { db.parametres.coachs[i][k] = v; save(); }
function supprimerCoach(i) { db.parametres.coachs.splice(i,1); save(); renderCoachs(); }
renderCoachs();

// Stats données
const nPres = Object.keys(db.presences).length;
document.getElementById('dataStats').textContent = `${db.joueurs.length} joueurs · ${db.matchs.length} matchs · ${nPres} feuilles de présence · ${db.documents.length} documents`;

function sauver() {
  db.parametres.clubNom = document.getElementById('clubNom').value;
  db.parametres.clubTel = document.getElementById('clubTel').value;
  db.parametres.clubEmail = document.getElementById('clubEmail').value;
  db.parametres.clubAdresse = document.getElementById('clubAdresse').value;
  save();
  alert('Paramètres enregistrés.');
}

function exporterBackup() {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'footmanager-backup-' + new Date().toISOString().slice(0,10) + '.json'; a.click();
}
function importerBackup() {
  const input = document.createElement('input'); input.type = 'file'; input.accept = '.json';
  input.onclick = function(){ this.value = null; };
  input.onchange = function() {
    const f = this.files[0]; if (!f) return;
    const r = new FileReader();
    r.onclick = function(){ this.value = null; };
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (!data.joueurs && !data.matchs) { alert('Fichier invalide.'); return; }
        if (!confirm('Remplacer toutes les données actuelles par cette sauvegarde ?')) return;
        localStorage.setItem('footmanager', JSON.stringify(data));
        location.reload();
      } catch(e) { alert('Erreur de lecture.'); }
    };
    r.readAsText(f);
  };
  input.click();
}
function viderTout() {
  if (!confirm('ATTENTION : toutes les données seront effacées définitivement. Continuer ?')) return;
  if (!confirm('Dernière confirmation : vraiment tout supprimer ?')) return;
  localStorage.removeItem('footmanager);
  location.reload();
}
</script>
</body>
</html>
