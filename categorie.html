<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIMOUNI Soccer Stats — Catégorie</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
  body { background:#fafafa; color:#222; }
  header { background:#fff; color:#2FAEE0; height:72px; display:flex; align-items:center; padding:0 32px; border-bottom:1px solid #eee; }
  .logo { font-weight:700; font-size:22px; }
  .floating-burger { position:fixed; top:20px; left:20px; width:48px; height:48px; background:#fff; border:1px solid #e0e0e0; border-radius:50%; box-shadow:0 2px 10px rgba(0,0,0,.06); display:none; align-items:center; justify-content:center; font-size:24px; color:#2FAEE0; cursor:pointer; z-index:100; }
  .floating-burger.show { display:flex; }
  #overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.25); z-index:200; }
  #overlay.open { display:block; }
  nav { position:fixed; top:0; left:-280px; width:270px; height:100%; background:#fff; z-index:300; transition:left .25s; overflow-y:auto; padding:32px 0; box-shadow:2px 0 16px rgba(0,0,0,.08); }
  nav.open { left:0; }
  nav a { display:block; color:#333; text-decoration:none; padding:16px 28px; font-size:16px; }
  nav a:hover, nav a.active { background:#f7fbff; color:#2FAEE0; }
  main { max-width:880px; margin:0 auto; padding:48px 28px 120px; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:28px; }
  h1 { font-size:28px; color:#2FAEE0; }
  .count { font-size:15px; color:#777; margin-top:4px; }
  .btn-add { background:#2e9e5b; color:#fff; border:none; border-radius:12px; padding:12px 20px; font-size:15px; font-weight:600; cursor:pointer; }
  .tools { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:28px; }
  .search { flex:1; min-width:200px; padding:14px 18px; border:1px solid #ddd; border-radius:12px; font-size:15px; background:#fff; }
  select { padding:14px 18px; border:1px solid #ddd; border-radius:12px; font-size:15px; background:#fff; }
  .player { background:#fff; border-radius:16px; padding:16px 20px; box-shadow:0 2px 8px rgba(0,0,0,.04); display:flex; align-items:center; gap:16px; cursor:pointer; margin-bottom:14px; border:1px solid #f0f0f0; }
  .player:hover { border-color:#2FAEE0; }
  .avatar { width:48px; height:48px; border-radius:50%; background:#2FAEE0; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; }
  .info { flex:1; }
  .info .name { font-weight:600; font-size:16px; }
  .info .meta { font-size:13px; color:#888; margin-top:2px; }
  .maillot { font-size:14px; color:#2FAEE0; font-weight:600; min-width:32px; text-align:center; }
  .tag { display:inline-block; padding:4px 10px; border-radius:12px; font-size:12px; font-weight:600; }
  .tag.actif { background:#e6f7ed; color:#2e9e5b; }
  .tag.blesse { background:#fff3e0; color:#e67e22; }
  .tag.suspendu { background:#fdecea; color:#c0392b; }
  .empty { text-align:center; color:#aaa; padding:48px 16px; font-size:15px; }
  .back-btn { position:fixed; bottom:24px; left:20px; width:44px; height:44px; background:#fff; border:1px solid #e0e0e0; border-radius:50%; box-shadow:0 2px 10px rgba(0,0,0,.06); display:flex; align-items:center; justify-content:center; font-size:20px; color:#2FAEE0; cursor:pointer; z-index:100; }
</style>
</head>
<body>
<header>
  <div class="logo" id="logo">Catégorie</div>
</header>
<button class="floating-burger" id="floatBurger" onclick="toggleMenu()">&#9776;</button>
<div id="overlay" onclick="toggleMenu()"></div>
<nav id="menu">
  <a href="index.html">Tableau de bord</a>
  <a href="categories.html" class="active">Catégories</a>
  <a href="matchs.html">Matchs</a>
  <a href="presences.html">Présences</a>
  <a href="convocations.html">Convocations</a>
  <a href="documents.html">Documents</a>
  <a href="parametres.html">Paramètres</a>
  <a href="export.html">Export</a>
</nav>
<main>
  <div class="top">
    <div>
      <h1 id="cat-title">Catégorie</h1>
      <div class="count" id="cat-count">0 joueurs</div>
    </div>
    <button class="btn-add" onclick="ajouterJoueur()">+ Ajouter un joueur</button>
  </div>
  <div class="tools">
    <input class="search" type="text" placeholder="Rechercher un joueur..." oninput="filterPlayers(this.value)">
    <select onchange="sortPlayers(this.value)">
      <option value="nom">Trier par nom</option>
      <option value="statut">Trier par statut</option>
      <option value="maillot">Trier par maillot</option>
    </select>
  </div>
  <div id="list"></div>
</main>
<button class="back-btn" onclick="history.back()">←</button>
<script>
const CATS = ['U6','U7','U8','U9','U10','U11','U12','U13','U14','U15','U16','U17','U18'];
function load(k,fb){ try{ return JSON.parse(localStorage.getItem(k)) ?? fb; }catch(e){ return fb; } }
let players = load('fm.players', []);
const params = new URLSearchParams(location.search);
let cat = (params.get('cat') || 'U11').toUpperCase();
if (!CATS.includes(cat)) cat = 'U11';
let sortBy = 'nom';
function toggleMenu(){
  document.getElementById('menu').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}
function ajouterJoueur(){
  location.href = 'joueur.html?cat=' + cat + '&new=1';
}
function filterPlayers(q){
  document.querySelectorAll('.player').forEach(r => {
    r.style.display = r.dataset.name.toLowerCase().includes(q.toLowerCase()) ? '' : 'none';
  });
}
function sortPlayers(v){ sortBy = v; render(); }
function render(){
  const list = document.getElementById('list');
  let cp = players.filter(p => p.cat === cat);
  if (sortBy === 'nom') cp.sort((a,b) => (a.nom + ' ' + a.prenom).localeCompare(b.nom + ' ' + b.prenom));
  else if (sortBy === 'statut') cp.sort((a,b) => (a.statut || '').localeCompare(b.statut || ''));
  else if (sortBy === 'maillot') cp.sort((a,b) => (a.maillot || 99) - (b.maillot || 99));
  document.getElementById('cat-title').textContent = cat;
  document.getElementById('logo').textContent = cat;
  document.getElementById('cat-count').textContent = cp.length + ' joueur' + (cp.length > 1 ? 's' : '');
  list.innerHTML = '';
  if (!cp.length) {
    list.innerHTML = '<div class="empty">Aucun joueur dans cette catégorie.</div>';
    return;
  }
  cp.forEach(p => {
    const ini = (p.prenom || '?')[0] + (p.nom || '?')[0];
    list.innerHTML += `<div class="player" data-name="${p.prenom} ${p.nom}" onclick="location.href='joueur.html?id=${p.id}'">
      <div class="avatar">${ini}</div>
      <div class="info"><div class="name">${p.prenom} ${p.nom}</div><div class="meta">${p.poste || '—'}</div></div>
      <div class="maillot">${p.maillot || '—'}</div>
      <span class="tag ${p.statut || 'actif'}">${p.statut || 'actif'}</span>
    </div>`;
  });
}
window.addEventListener('scroll',()=>{
  const burger = document.getElementById('floatBurger');
  if (window.scrollY > 100) burger.classList.add('show');
  else burger.classList.remove('show');
});
render();
</script>
</body>
</html>
