<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIMOUNI Soccer Stats — Matchs</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
  body { background:#fafafa; color:#222; }
  header { background:#fff; color:#2FAEE0; height:72px; display:flex; align-items:center; padding:0 32px; border-bottom:1px solid #eee; }
  .logo { font-weight:700; font-size:22px; }
  .floating-burger { position:fixed; top:20px; left:20px; width:48px; height:48px; background:#fff; border:1px solid #e0e0e0; border-radius:50%; box-shadow:0 2px 10px rgba(0,0,0,.06); display:none; align-items:center; justify-content:center; font-size:24px; color:#2FAEE0; cursor:pointer; z-index:100; }
  .floating-burger.show { display:flex; }
  #overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.25); z-index:200; }
  #overlay.open { display:block; }
  nav { position:fixed; top:0; left:-280px; width:270px; height:100%; background:#fff; z-index:300; transition:left .25s; overflow-y:auto; padding:32px 0; box-shadow:2px 0 16px rgba(0,0,0,.08); }
  nav.open { left:0; }
  nav a { display:block; color:#333; text-decoration:none; padding:16px 28px; font-size:16px; }
  nav a:hover, nav a.active { background:#f7fbff; color:#2FAEE0; }
  main { max-width:880px; margin:0 auto; padding:48px 28px 120px; }
  h1 { font-size:28px; margin-bottom:24px; color:#2FAEE0; }
  .tabs { display:flex; gap:8px; margin-bottom:28px; background:#f0f0f0; border-radius:12px; padding:6px; }
  .tabs button { flex:1; border:none; background:transparent; padding:12px; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; color:#666; }
  .tabs button.active { background:#fff; color:#2FAEE0; box-shadow:0 2px 6px rgba(0,0,0,.05); }
  .panel { display:none; }
  .panel.active { display:block; }
  .card { background:#fff; border-radius:16px; padding:18px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,.04); cursor:pointer; border:1px solid #f0f0f0; }
  .card:hover { border-color:#2FAEE0; }
  .card h3 { font-size:16px; margin-bottom:6px; }
  .card .meta { font-size:14px; color:#777; }
  .badge { display:inline-block; font-size:12px; font-weight:700; padding:4px 10px; border-radius:12px; }
  .badge.avenir { background:#e0f2fe; color:#0369a1; }
  .badge.victoire { background:#dcfce7; color:#166534; }
  .badge.defaite { background:#fee2e2; color:#991b1b; }
  .badge.nul { background:#fef9c3; color:#854d0e; }
  .btn { border:none; border-radius:12px; padding:12px 18px; font-size:15px; font-weight:600; cursor:pointer; }
  .btn.primary { background:#2FAEE0; color:#fff; }
  .btn.ghost { background:#f0f0f0; color:#333; }
  .form-row { margin-bottom:16px; }
  .form-row label { display:block; font-size:14px; font-weight:600; margin-bottom:6px; color:#555; }
  .form-row input, .form-row select { width:100%; padding:12px; border:1px solid #ddd; border-radius:10px; font-size:15px; }
  .form-row-duo { display:flex; gap:12px; }
  .form-row-duo > div { flex:1; }
  .empty { text-align:center; color:#aaa; padding:40px; font-size:15px; }
  .filter-bar { display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
  .filter-bar select { padding:10px 14px; border:1px solid #ddd; border-radius:10px; font-size:14px; background:#fff; }
  .back-btn { position:fixed; bottom:24px; left:20px; width:44px; height:44px; background:#fff; border:1px solid #e0e0e0; border-radius:50%; box-shadow:0 2px 10px rgba(0,0,0,.06); display:flex; align-items:center; justify-content:center; font-size:20px; color:#2FAEE0; cursor:pointer; z-index:100; }
</style>
</head>
<body>
<header>
  <div class="logo">Matchs</div>
</header>
<button class="floating-burger" id="floatBurger" onclick="toggleMenu()">&#9776;</button>
<div id="overlay" onclick="toggleMenu()"></div>
<nav id="menu">
  <a href="index.html">Tableau de bord</a>
  <a href="categories.html">Catégories</a>
  <a href="matchs.html" class="active">Matchs</a>
  <a href="presences.html">Présences</a>
  <a href="convocations.html">Convocations</a>
  <a href="documents.html">Documents</a>
  <a href="parametres.html">Paramètres</a>
  <a href="export.html">Export</a>
</nav>
<main>
  <h1>Matchs</h1>
  <div class="tabs">
    <button class="active" onclick="showTab('calendrier',this)">Calendrier</button>
    <button onclick="showTab('resultats',this)">Résultats</button>
  </div>
  <div class="panel active" id="tab-calendrier">
    <div class="filter-bar">
      <select id="filtreCat" onchange="renderCalendrier()"><option value="">Toutes catégories</option></select>
    </div>
    <div id="listeCalendrier"></div>
    <button class="btn primary" style="width:100%;margin-top:12px" onclick="ouvrirFormMatch()">+ Ajouter un match</button>
  </div>
  <div class="panel" id="tab-resultats">
    <div id="listeResultats"></div>
  </div>
</main>
<button class="back-btn" onclick="history.back()">←</button>

<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:16px">
  <div style="background:#fff;border-radius:16px;padding:24px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto">
    <h2 style="font-size:18px;margin-bottom:20px;color:#2FAEE0">Nouveau match</h2>
    <div class="form-row"><label>Catégorie</label><select id="mCat"></select></div>
    <div class="form-row"><label>Date</label><input type="date" id="mDate"></div>
    <div class="form-row-duo">
      <div class="form-row"><label>Heure</label><input type="time" id="mHeure"></div>
      <div class="form-row"><label>RDV</label><input type="time" id="mRdv"></div>
    </div>
    <div class="form-row"><label>Lieu</label><input type="text" id="mLieu" placeholder="Terrain"></div>
    <div class="form-row"><label>Adversaire</label><input type="text" id="mAdv" placeholder="Équipe adverse"></div>
    <div class="form-row"><label>Domicile / Extérieur</label><select id="mDomicile"><option value="dom">Domicile</option><option value="ext">Extérieur</option></select></div>
    <div style="display:flex;gap:12px;margin-top:20px">
      <button class="btn ghost" style="flex:1" onclick="fermerModal()">Annuler</button>
      <button class="btn primary" style="flex:1" onclick="sauverMatch()">Enregistrer</button>
    </div>
  </div>
</div>

<script>
const CATS = ['U6','U7','U8','U9','U10','U11','U12','U13','U14','U15','U16','U17','U18'];
function load(k,fb){ try{ return JSON.parse(localStorage.getItem(k)) ?? fb; }catch(e){ return fb; } }
function save(k,v){ localStorage.setItem(k, JSON.stringify(v)); }
let matchs = load('fm.matchs', []);
let players = load('fm.players', []);

function toggleMenu(){
  document.getElementById('menu').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}
function showTab(id, btn){
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  btn.classList.add('active');
  if(id==='calendrier') renderCalendrier();
  if(id==='resultats') renderResultats();
}
CATS.forEach(c => {
  document.getElementById('filtreCat').innerHTML += `<option value="${c}">${c}</option>`;
  document.getElementById('mCat').innerHTML += `<option value="${c}">${c}</option>`;
});
function renderCalendrier(){
  const cat = document.getElementById('filtreCat').value;
  const list = matchs.filter(m => !cat || m.cat === cat).sort((a,b) => (a.date||'').localeCompare(b.date||''));
  const el = document.getElementById('listeCalendrier');
  if(!list.length){ el.innerHTML = '<div class="empty">Aucun match programmé.</div>'; return; }
  el.innerHTML = list.map(m => `
    <div class="card">
      <h3>${m.domicile==='dom'?'🏠':'✈️'} ${m.adversaire || 'Adversaire'} — ${m.cat}</h3>
      <div class="meta">${m.date || ''} ${m.heure || ''} · ${m.lieu || 'Lieu à définir'}</div>
    </div>
  `).join('');
}
function renderResultats(){
  document.getElementById('listeResultats').innerHTML = '<div class="empty">Résultats à venir.</div>';
}
function ouvrirFormMatch(){
  document.getElementById('mDate').value = '';
  document.getElementById('mHeure').value = '';
  document.getElementById('mRdv').value = '';
  document.getElementById('mLieu').value = '';
  document.getElementById('mAdv').value = '';
  document.getElementById('modal').style.display = 'flex';
}
function fermerModal(){ document.getElementById('modal').style.display = 'none'; }
function sauverMatch(){
  const m = {
    id: 'm' + Date.now(),
    cat: document.getElementById('mCat').value,
    date: document.getElementById('mDate').value,
    heure: document.getElementById('mHeure').value,
    rdv: document.getElementById('mRdv').value,
    lieu: document.getElementById('mLieu').value,
    adversaire: document.getElementById('mAdv').value,
    domicile: document.getElementById('mDomicile').value
  };
  if(!m.date){ alert('La date est obligatoire.'); return; }
  matchs.push(m);
  save('fm.matchs', matchs);
  fermerModal();
  renderCalendrier();
}
window.addEventListener('scroll',()=>{
  const burger = document.getElementById('floatBurger');
  if(window.scrollY > 100) burger.classList.add('show');
  else burger.classList.remove('show');
});
renderCalendrier();
</script>
</body>
</html>
