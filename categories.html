<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foot Manager — Catégories</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
  body { background:#f4f6f8; color:#1a2332; }
  header { background:#0f2744; color:#fff; height:56px; display:flex; align-items:center; padding:0 16px; position:sticky; top:0; z-index:100; }
  .burger { background:none; border:none; color:#fff; font-size:26px; cursor:pointer; padding:8px; margin-right:12px; }
  .logo { font-weight:700; font-size:18px; letter-spacing:1px; }
  #overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:200; }
  #overlay.open { display:block; }
  nav { position:fixed; top:0; left:-280px; width:280px; height:100%; background:#0f2744; z-index:300; transition:left .25s ease; overflow-y:auto; padding:16px 0; }
  nav.open { left:0; }
  nav .close { color:#fff; background:none; border:none; font-size:22px; padding:8px 16px; cursor:pointer; display:block; width:100%; text-align:left; }
  nav a { display:block; color:#c9d6e3; text-decoration:none; padding:12px 20px; font-size:15px; border-left:3px solid transparent; }
  nav a:hover, nav a.active { background:#1a3a5c; color:#fff; border-left-color:#3d9cf0; }
  nav .sub { padding-left:36px; font-size:13px; color:#8fa3b8; }
  nav .sub:hover { color:#fff; }
  main { max-width:1100px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:22px; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
  .cat-card { background:#fff; border-radius:10px; padding:20px 16px; box-shadow:0 1px 4px rgba(0,0,0,.08); cursor:pointer; text-align:center; transition:transform .15s, box-shadow .15s; }
  .cat-card:hover { transform:translateY(-3px); box-shadow:0 4px 14px rgba(0,0,0,.12); }
  .cat-card .cat { font-size:22px; font-weight:700; color:#0f2744; }
  .cat-card .count { font-size:13px; color:#6b7c93; margin-top:6px; }
  .cat-card .bar { height:6px; background:#e2e8f0; border-radius:3px; margin-top:10px; overflow:hidden; }
  .cat-card .bar-fill { height:100%; border-radius:3px; }
  .cat-card .bar-fill.green { background:#2e9e5b; }
  .cat-card .bar-fill.orange { background:#e67e22; }
  .cat-card .bar-fill.red { background:#c0392b; }
  .search { width:100%; padding:10px 14px; border:1px solid #d5dde8; border-radius:8px; font-size:14px; margin-bottom:20px; background:#fff; }
  @media(max-width:600px){ .grid{grid-template-columns:repeat(3,1fr);} }
</style>
</head>
<body>
<header>
  <button class="burger" onclick="toggleMenu()">&#9776;</button>
  <div class="logo">FOOT MANAGER</div>
</header>
<div id="overlay" onclick="toggleMenu()"></div>
<nav id="menu">
  <button class="close" onclick="toggleMenu()">&#10005; Fermer</button>
  <a href="index.html">Tableau de bord</a>
  <a href="categories.html" class="active">Catégories</a>
  <a href="#" class="sub" onclick="go('u6')">U6</a><a href="#" class="sub" onclick="go('u7')">U7</a><a href="#" class="sub" onclick="go('u8')">U8</a><a href="#" class="sub" onclick="go('u9')">U9</a><a href="#" class="sub" onclick="go('u10')">U10</a><a href="#" class="sub" onclick="go('u11')">U11</a><a href="#" class="sub" onclick="go('u12')">U12</a><a href="#" class="sub" onclick="go('u13')">U13</a><a href="#" class="sub" onclick="go('u14')">U14</a><a href="#" class="sub" onclick="go('u15')">U15</a><a href="#" class="sub" onclick="go('u16')">U16</a><a href="#" class="sub" onclick="go('u17')">U17</a><a href="#" class="sub" onclick="go('u18')">U18</a>
  <a href="#" onclick="go('matchs')">Matchs</a>
  <a href="#" onclick="go('presences')">Présences</a>
  <a href="#" onclick="go('convocations')">Convocations</a>
  <a href="#" onclick="go('documents')">Documents</a>
  <a href="#" onclick="go('parametres')">Paramètres</a>
  <a href="export.html">Export</a>
</nav>
<main>
  <h1>Catégories</h1>
  <input class="search" type="text" placeholder="Rechercher une catégorie..." oninput="filterCats(this.value)">
  <div class="grid" id="grid"></div>
</main>
<script>
const CATS=['U6','U7','U8','U9','U10','U11','U12','U13','U14','U15','U16','U17','U18'];
function load(k,fb){try{return JSON.parse(localStorage.getItem('fm.'+k))??fb;}catch(e){return fb;}}
let players=load('players',[]);
function toggleMenu(){document.getElementById('menu').classList.toggle('open');document.getElementById('overlay').classList.toggle('open');}
function go(page){toggleMenu();if(page.startsWith('u')){location.href='categorie.html?cat='+page.toUpperCase();}else{alert('Navigation vers : '+page+' (page à construire)');}}
function filterCats(q){
  const cards=document.querySelectorAll('.cat-card');
  cards.forEach(c=>{c.style.display=c.dataset.cat.toLowerCase().includes(q.toLowerCase())?'':'none';});
}
function render(){
  const grid=document.getElementById('grid);
  grid.innerHTML='';
  CATS.forEach(c=>{
    const n=players.filter(p=>p.cat===c).length;
    const max=12; const pct=Math.min(100,Math.round(n/max*100));
    let cls='red'; if(n>=max)cls='green'; else if(n>=6)cls='orange';
    grid.innerHTML+=`<div class="cat-card" data-cat="${c}" onclick="go('${c.toLowerCase()}')"><div class="cat">${c}</div><div class="count">${n} joueur${n>1?'s':''}</div><div class="bar"><div class="bar-fill ${cls}" style="width:${pct}%"></div></div></div>`;
  });
}
render();
</script>
</body>
</html>
