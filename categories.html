<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIMOUNI Soccer Stats — Catégories</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
  body { background:#fafafa; color:#222; }
  header { background:#fff; color:#2FAEE0; height:72px; display:flex; align-items:center; padding:0 32px; border-bottom:1px solid #eee; }
  .logo { font-weight:700; font-size:22px; }
  .floating-burger { position:fixed; top:20px; left:20px; width:48px; height:48px; background:#fff; border:1px solid #e0e0e0; border-radius:50%; box-shadow:0 2px 10px rgba(0,0,0,.06); display:flex; align-items:center; justify-content:center; font-size:24px; color:#2FAEE0; cursor:pointer; z-index:100; }
  #overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.25); z-index:200; }
  #overlay.open { display:block; }
  nav { position:fixed; top:0; left:-280px; width:270px; height:100%; background:#fff; z-index:300; transition:left .25s; overflow-y:auto; padding:24px 0; box-shadow:2px 0 16px rgba(0,0,0,.08); }
  nav.open { left:0; }
  .nav-header { display:flex; align-items:center; gap:12px; padding:0 24px 20px; border-bottom:1px solid #eee; margin-bottom:12px; }
  .nav-header img { width:40px; height:40px; }
  .nav-header span { font-weight:700; font-size:16px; color:#2FAEE0; }
  nav a { display:block; color:#333; text-decoration:none; padding:16px 28px; font-size:16px; border-left:3px solid transparent; }
  nav a:hover, nav a.active { background:#f7fbff; color:#2FAEE0; border-left-color:#2FAEE0; }
  nav .sub { padding-left:44px; font-size:14px; color:#777; }
  nav .sub:hover { color:#2FAEE0; }
  main { max-width:880px; margin:0 auto; padding:48px 28px 120px; }
  h1 { font-size:28px; margin-bottom:24px; color:#2FAEE0; }
  .search { width:100%; padding:14px 18px; border:1px solid #ddd; border-radius:12px; font-size:15px; margin-bottom:28px; background:#fff; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:20px; }
  .cat-card { background:#fff; border-radius:16px; padding:24px 16px; box-shadow:0 2px 8px rgba(0,0,0,.04); cursor:pointer; text-align:center; border:1px solid #f0f0f0; transition:transform .15s; }
  .cat-card:hover { transform:translateY(-3px); border-color:#2FAEE0; }
  .cat-card .cat { font-size:24px; font-weight:700; color:#2FAEE0; }
  .cat-card .count { font-size:14px; color:#777; margin-top:8px; }
  .back-btn { position:fixed; bottom:24px; left:20px; width:44px; height:44px; background:#fff; border:1px solid #e0e0e0; border-radius:50%; box-shadow:0 2px 10px rgba(0,0,0,.06); display:flex; align-items:center; justify-content:center; font-size:20px; color:#2FAEE0; cursor:pointer; z-index:100; }
</style>
</head>
<body>
<header>
  <div class="logo">Catégories</div>
</header>
<button class="floating-burger" id="floatBurger" onclick="toggleMenu()">&#9776;</button>
<div id="overlay" onclick="toggleMenu()"></div>
<nav id="menu">
  <div class="nav-header">
    <img src="favicon.svg" alt="Logo">
    <span>MIMOUNI Soccer Stats</span>
  </div>
  <a href="index.html">Tableau de bord</a>
  <a href="categories.html" class="active">Catégories</a>
  <a href="categorie.html?cat=U6" class="sub">U6</a>
  <a href="categorie.html?cat=U7" class="sub">U7</a>
  <a href="categorie.html?cat=U8" class="sub">U8</a>
  <a href="categorie.html?cat=U9" class="sub">U9</a>
  <a href="categorie.html?cat=U10" class="sub">U10</a>
  <a href="categorie.html?cat=U11" class="sub">U11</a>
  <a href="categorie.html?cat=U12" class="sub">U12</a>
  <a href="categorie.html?cat=U13" class="sub">U13</a>
  <a href="categorie.html?cat=U14" class="sub">U14</a>
  <a href="categorie.html?cat=U15" class="sub">U15</a>
  <a href="categorie.html?cat=U16" class="sub">U16</a>
  <a href="categorie.html?cat=U17" class="sub">U17</a>
  <a href="categorie.html?cat=U18" class="sub">U18</a>
  <a href="matchs.html">Matchs</a>
  <a href="presences.html">Présences</a>
  <a href="convocations.html">Convocations</a>
  <a href="documents.html">Documents</a>
  <a href="parametres.html">Paramètres</a>
  <a href="export.html">Export</a>
</nav>
<main>
  <h1>Catégories</h1>
  <input class="search" type="text" placeholder="Rechercher une catégorie..." oninput="filterCats(this.value)">
  <div class="grid" id="grid"></div>
</main>
<button class="back-btn" onclick="history.back()">←</button>
<script>
const CATS=['U6','U7','U8','U9','U10','U11','U12','U13','U14','U15','U16','U17','U18'];
function load(k,fb){ try{ return JSON.parse(localStorage.getItem(k)) ?? fb; }catch(e){ return fb; } }
let players = load('fm.players', []);
function toggleMenu(){
  document.getElementById('menu').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}
function go(cat){
  document.getElementById('menu').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  location.href = 'categorie.html?cat=' + cat;
}
function filterCats(q){
  document.querySelectorAll('.cat-card').forEach(c => {
    c.style.display = c.dataset.cat.toLowerCase().includes(q.toLowerCase()) ? '' : 'none';
  });
}
function render(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  CATS.forEach(c => {
    const n = players.filter(p => p.cat === c).length;
    grid.innerHTML += `<div class="cat-card" data-cat="${c}" onclick="go('${c}')"><div class="cat">${c}</div><div class="count">${n} joueur${n>1?'s':''}</div></div>`;
  });
}
render();
</script>
</body>
</html>
